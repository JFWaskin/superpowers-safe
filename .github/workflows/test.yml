name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (skill content + safety gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run safety-check skill test
        run: bash tests/claude-code/test-safety-check.sh || true
        # The Claude-discovery test (Test 6) requires the claude CLI; we
        # skip on failure here so PRs can still merge on the static
        # checks. The Claude-discovery test is run manually before each
        # release. See docs/eval-protocol.md.

      - name: Run mandatory-gate test
        run: bash tests/claude-code/test-mandatory-gate.sh

      - name: Lint shell scripts
        run: bash scripts/lint-shell.sh

      - name: Validate JSON manifests
        run: |
          for f in \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json \
            .cursor-plugin/plugin.json \
            .kimi-plugin/plugin.json \
            .hermes-plugin/plugin.yaml \
            gemini-extension.json \
            package.json; do
            if [ -f "$f" ]; then
              echo "  Validating $f"
              case "$f" in
                *.yaml) python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1 ;;
                *.json) python3 -c "import json; json.load(open('$f'))" || exit 1 ;;
              esac
            fi
          done
          echo "All manifests valid"

      - name: Verify fork identity
        run: |
          # Sanity-check that the fork identity is consistent across manifests
          grep -q '"name": "superpowers-safe"' .claude-plugin/plugin.json
          grep -q '"name": "superpowers-safe"' .codex-plugin/plugin.json
          grep -q '"name": "superpowers-safe"' .cursor-plugin/plugin.json
          grep -q '"name": "superpowers-safe"' .kimi-plugin/plugin.json
          grep -q '"name": "superpowers-safe"' gemini-extension.json
          grep -q '"name": "superpowers-safe"' .claude-plugin/marketplace.json
          grep -q 'name: superpowers-safe' .hermes-plugin/plugin.yaml
          grep -q '"name": "superpowers-safe"' package.json
          echo "Fork identity consistent across all 8 manifests"

      - name: Verify safety-gate wiring
        run: |
          # Verify the <MANDATORY-SAFETY-GATE> block is in using-superpowers
          grep -q '<MANDATORY-SAFETY-GATE>' skills/using-superpowers/SKILL.md
          # Verify the safety-check skill exists
          test -f skills/safety-check/SKILL.md
          # Verify the safety-guard.py hook reference is in docs
          grep -q 'safety-guard' docs/safety-gate.md
          echo "Safety gate wiring verified"

  claude-discovery:
    name: Claude skill discovery (optional, requires ANTHROPIC_API_KEY secret)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skips cleanly when ANTHROPIC_API_KEY is not set. The job uses a
    # step-output gate (not `if: ... && secrets.X`, which causes the
    # workflow to fail at parse time when the secret is missing).
    # To enable: Settings → Secrets and variables → Actions → New
    # repository secret, name=ANTHROPIC_API_KEY, value=sk-ant-...

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Detect ANTHROPIC_API_KEY
        id: check-secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is set; will run Claude discovery"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not set; skipping Claude discovery (static job is the real gate)"
          fi

      - name: Install claude CLI
        if: steps.check-secret.outputs.skip != 'true'
        # `| bash` (not `| sh`) because Ubuntu's /bin/sh is dash, which
        # cannot parse the bash-specific syntax in install.sh line 9+
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run safety-check skill test (with Claude)
        if: steps.check-secret.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash tests/claude-code/test-safety-check.sh
